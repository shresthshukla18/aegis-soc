<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">AEGIS SOC architecture</title><desc id="desc">Traffic sources feed a C++ packet capture and detection engine, which serves a local SOC dashboard and API.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b43"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#17a879"/><stop offset="1" stop-color="#35a7d8"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#8bb6d4" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="560" rx="24" fill="url(#bg)"/><text x="55" y="62" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">AEGIS SOC</text><text x="55" y="91" fill="#a9c0d5" font-family="Arial,sans-serif" font-size="16">C++20 network intrusion-detection prototype</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="170" width="250" height="230" rx="18" fill="#203650" stroke="#45627e"/><text x="180" y="215" fill="#fff" font-size="20" font-weight="700">Traffic sources</text><text x="180" y="260" fill="#c5d7e6" font-size="15">Simulation data</text><text x="180" y="295" fill="#c5d7e6" font-size="15">Authorized lab NIC</text><text x="180" y="330" fill="#c5d7e6" font-size="15">Optional libpcap</text>
<rect x="425" y="145" width="270" height="280" rx="18" fill="#203c42" stroke="#28a77c" stroke-width="2"/><text x="560" y="195" fill="#fff" font-size="21" font-weight="700">C++20 engine</text><text x="560" y="245" fill="#c5e8dc" font-size="15">Packet decoding</text><text x="560" y="280" fill="#c5e8dc" font-size="15">Rules + heuristics</text><text x="560" y="315" fill="#c5e8dc" font-size="15">Event aggregation</text><text x="560" y="350" fill="#c5e8dc" font-size="15">In-memory state</text>
<rect x="815" y="170" width="230" height="230" rx="18" fill="#203650" stroke="#45627e"/><text x="930" y="215" fill="#fff" font-size="20" font-weight="700">Local SOC UI</text><text x="930" y="260" fill="#c5d7e6" font-size="15">Browser dashboard</text><text x="930" y="295" fill="#c5d7e6" font-size="15">HTTP JSON API</text><text x="930" y="330" fill="#c5d7e6" font-size="15">127.0.0.1 only</text></g>
<path d="M305 285 H415" stroke="#8bb6d4" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 285 H805" stroke="#8bb6d4" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="465" width="990" height="48" rx="12" fill="#18283b" stroke="#3b526c"/><text x="550" y="495" fill="#f3c77b" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Prototype scope: passive IDS • no inline blocking • no persistent storage • dual sensors are independent</text></svg>
